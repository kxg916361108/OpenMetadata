  ingestion:
    # TES-53 F1: 镜像派生一层,补 apache-airflow-providers-mysql(见
    # Dockerfile.ingestion-providers)。这台容器是当前唯一在跑的 Airflow 调度器,
    # 没有 MySQL provider → `MySqlHook` 不可用 → doris_events_contract_check
    # import 失败且**不显性报错**(DB 有历史 run、卷里有文件)。
    # 基础镜像 development-ingestion 必须先用上游 Dockerfile.ci 构建好,
    # 回滚方式写在 Dockerfile.ingestion-providers 头部。
    build:
      context: .
      dockerfile: Dockerfile.ingestion-providers
      args:
        BASE_IMAGE: ${INGESTION_BASE_IMAGE:-development-ingestion}
    image: development-ingestion:tes53
    container_name: openmetadata_ingestion
    # TES-51: 采集容器是采集时临时起的大件(restart=no),此前 HostConfig.Memory=0
    # (上限=VM 全量),实测峰值 1.63 GB,把 VM MemAvailable 从 1 602 MB 打到 889 MB。
    # 上限取 2048 MB 而非 1536 MB:1.63 GB 的峰值压到 1.5 GB 会把它自己 OOM。
    # TES-51 复核后改为 2560 MB:复测期间该容器 cgroup anon 稳定 1 700 MB、峰值 1 908 MB,
    # 2048 只剩 ~140 MB 余量(93% 利用率),打满的形态是采集中断而不是内存失控。
    # 证据:evidence/capacity_ingest_peak_2026-10-20.json。2560 仍比"无上限"少 5 GB 多暴露面。
    # memswap_limit 与 mem_limit 相等 = 该容器不借 swap,避免把整台 VM 拖进换页。
    # 写在这里而不是事后 docker update:该容器每次采集都重建,docker update 留不住。
    mem_limit: 2560m
    memswap_limit: 2560m
    # TES-134: 容器 stdout 是 scheduler / api-server / executor 唯一的日志出口
    # (`/opt/airflow/logs` 下没有 scheduler 文件日志,只有 dag-processor.log)。
    # 改前是镜像默认 json-file 20m×5 = 100 MB:实测 12.87 MB/h(DEBUG,本批 DAG 的常态)
    # ⇒ 只覆盖 **7.8 小时**。INC-2026-10-21-02 停摆 10.08 h 后复盘时,窗口内的
    # scheduler 行早就被轮转掉了 —— 这就是本单要修的东西。
    # 现在的算术(全部来自实测,见 evidence/tes134/tes134_evidence.json):
    #   raw 实测 308.8~364.0 MB/day(364 是 10-21 补数批次在跑时的峰值);同内容 gzip 13.9×
    #   50 MB × 60 文件 = 3000 MB raw = **8.2 天(按峰值 364 MB/day)/ 9.7 天(按常态)**;
    #   落盘 ≈ 50 MB + 59×50/13.9 ≈ **262 MB**(改前 100 MB,净增 ~162 MB,VM 剩余 2.6 GB)。
    # 取 60 而不取刚够 7 天的 44:日志量随批次密度变化(同一天里 308→364 MB/day),
    # 按"刚好 7 天"配会在忙的那周掉回 6 天。
    # compress=true 只压已轮转的文件:实测 docker logs 能透明读 .gz,
    # 且 max-file 严格生效(超出的最老文件被丢),见同目录 docs/tes134-log-retention.md。
    # 这里不降到 INFO:本批排障依据的正是 DEBUG 行
    # (dependency 'Not In Retry Period' / 'Ran scheduling loop' / 每拍决策),
    # 降级等于把证据本身删掉,靠压缩比换天数才是对的方向。
    # 声明在 compose 里而不是 docker update:log 配置**不是** docker update 能改的字段,
    # 且该容器每次采集/变更都会重建,写在 compose 才会随重建生效。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "60"
        compress: "true"
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      # 使用 OpenMetadata 自带 MySQL 的 airflow_db(而不是容器内 SQLite),
      # 这样调度历史/连接随容器重建仍保留。
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "mysql+mysqldb://airflow_user:airflow_pass@mysql:3306/airflow_db"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # TES-117: LocalExecutor 为每个 parallelism 槽常驻一个 `airflow worker` 进程。
      # 镜像默认 parallelism=32 -> 空闲态就有 33 个 worker,配 2560m 上限实测稳态
      # 1.98–2.16 GiB(79–86%),剩下不够一条 ≈1 GB 的 CLI(`airflow dags list-runs`
      # 之类),api-server 一被挤死就出现「run 建得出来、task 派不下去」。
      # 本批 DAG 是 5~6 个串行 task,4 并发足够;worker 进程数降到 ≤6。
      # 声明在这里而不是改 airflow.cfg:该文件随镜像重建被覆盖(同 mem_limit 的理由)。
      AIRFLOW__CORE__PARALLELISM: 4
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 4
      # TES-53 F2: 固定 fernet key。
      # 未设时 Airflow 每个进程各自生成随机 key(容器里 $AIRFLOW_HOME 下没有
      # fernet_key 文件可复用),于是 connections 里的口令只有"写它的那个进程"
      # 解得开:`airflow connections get` 抛 cryptography.fernet.InvalidToken,
      # OM 托管 DAG import 报 `Not Authorized! The given token does not match
      # the current bot's token!`,airflow_lineage_operator 报
      # `conn_id openmetadata_conn_id isn't defined` —— 每次容器重建就换一次 key,
      # 所有已存加密口令集体失效。
      # 值与 data-dev/docker-compose.yml 的 airflow 服务同一个(两份 Airflow
      # 共用同一批连接口令时不必换 key);dev 环境的口令本就明文在这里,不是新暴露。
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-qPf2gWhphCb3OeB6J-5sEbg-ofAORxI5pf65N5D3Kmo=}
      AIRFLOW__LOGGING__LOGGING_LEVEL: ${AIRFLOW_LOGGING_LEVEL:-DEBUG}
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: "/opt/airflow/dag_generated_configs"
      # The OM server runs on the host (IDE). Airflow must reach it back via host.docker.internal
      # without going through the local proxy baked into the ingestion image.
      no_proxy: "localhost,127.0.0.1,ingestion,mysql,elasticsearch,openmetadata-server,host.docker.internal"
      NO_PROXY: "localhost,127.0.0.1,ingestion,mysql,elasticsearch,openmetadata-server,host.docker.internal"
      # OpenLineage transport config (optional - enable for lineage via OL)
      # AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://openmetadata-server:8585/api/v1/openlineage/", "endpoint": "lineage", "auth": {"type": "api_key", "api_key": "<OM_JWT_TOKEN>"}}'
      # AIRFLOW__OPENLINEAGE__NAMESPACE: local_airflow
      DB_HOST: ${AIRFLOW_DB_HOST:-mysql}
      DB_PORT: ${AIRFLOW_DB_PORT:-3306}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow_db}
      DB_SCHEME: ${AIRFLOW_DB_SCHEME:-mysql+mysqldb}
      DB_USER: ${AIRFLOW_DB_USER:-airflow_user}
      DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pass}

      # extra connection-string properties for the database
      # EXAMPLE 
      # require SSL (only for Postgres)
      # properties: "?sslmode=require"
      DB_PROPERTIES: ${AIRFLOW_DB_PROPERTIES:-}
      
      # To test the lineage backend
      # AIRFLOW__LINEAGE__BACKEND: airflow_provider_openmetadata.lineage.backend.OpenMetadataLineageBackend
      # AIRFLOW__LINEAGE__AIRFLOW_SERVICE_NAME: local_airflow
      # AIRFLOW__LINEAGE__OPENMETADATA_API_ENDPOINT: http://openmetadata-server:8585/api
      # AIRFLOW__LINEAGE__JWT_TOKEN: ...
      # AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      # AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: true

      ## Secrets Manager
      # To integrate Azure Key Vault
      AIRFLOW__OPENMETADATA_SECRETS_MANAGER__AZURE_KEY_VAULT_NAME: ${OM_SM_VAULT_NAME:-""}
      AIRFLOW__OPENMETADATA_SECRETS_MANAGER__AZURE_TENANT_ID: ${OM_SM_TENANT_ID:-""}
      AIRFLOW__OPENMETADATA_SECRETS_MANAGER__AZURE_CLIENT_ID: ${OM_SM_CLIENT_ID:-""}
      AIRFLOW__OPENMETADATA_SECRETS_MANAGER__AZURE_CLIENT_SECRET: ${OM_SM_CLIENT_SECRET:-""}
      # To Integrate with AWS SSM
      AIRFLOW__OPENMETADATA_SECRETS_MANAGER__AWS_REGION: ${OM_SM_AWS_REGION:-""}
      AIRFLOW__OPENMETADATA_SECRETS_MANAGER__AWS_ACCESS_KEY_ID: ${OM_SM_AWS_ACCESS_KEY_ID:-""}
      AIRFLOW__OPENMETADATA_SECRETS_MANAGER__AWS_SECRET_ACCESS_KEY: ${OM_SM_AWS_SECRET_ACCESS_KEY:-""}
      # To integrate GCP
      AIRFLOW__OPENMETADATA_SECRETS_MANAGER__GCP_PROJECT_ID: ${OM_SM_PROJECT_ID:-""}

      # Apps
      ENABLE_APP_HelloPipelines: "true"

    entrypoint: /bin/bash
    command:
      - "/opt/airflow/ingestion_dependency.sh"
    depends_on:
      elasticsearch:
        condition: service_started
      mysql:
        condition: service_healthy
      openmetadata-server:
        condition: service_started
    expose:
      - 8080
    ports:
      - "8080:8080"
    networks:
      - local_app_net
    volumes:
      - ingestion-volume-dag-airflow:/opt/airflow/dag_generated_configs
      - ingestion-volume-dags:/opt/airflow/dags
      - ingestion-volume-tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:z  # Need 600 permissions to run DockerOperator


  mock-oidc-provider:
